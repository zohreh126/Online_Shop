{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حساب کاربری | Nexora</title>
  <link rel="stylesheet" href="{% static 'storefront/css/app.css' %}">
</head>
<body>
  <header class="site-header"><div class="container nav-wrap">
    <a class="brand" href="/"><span class="brand-mark">N</span><span>NEXORA<small>SMART ESSENTIALS</small></span></a>
    <a class="text-link" href="/">بازگشت به فروشگاه <span>←</span></a>
  </div></header>
  <main class="account-page container">
    <section class="account-card">
      <p class="eyebrow"><span></span> حساب نکستورا</p>
      <h1 id="account-title">ورود به حساب</h1>
      <p id="account-subtitle" class="account-subtitle">برای ادامه‌ی خرید وارد حساب کاربری‌ات شو.</p>
      <div id="account-alert" class="account-alert" hidden></div>
      <form id="login-form">
        <label>نام کاربری یا ایمیل<input name="identifier" required autocomplete="username"></label>
        <label>رمز عبور<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="primary-button account-submit" type="submit">ورود <span>←</span></button>
      </form>
      <form id="register-form" hidden>
        <div class="form-grid"><label>نام کاربری<input name="username" required autocomplete="username"></label><label>ایمیل<input name="email" type="email" required autocomplete="email"></label><label>نام<input name="first_name"></label><label>نام خانوادگی<input name="last_name"></label><label>رمز عبور<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>تکرار رمز عبور<input name="password_confirm" type="password" minlength="8" required autocomplete="new-password"></label></div>
        <button class="primary-button account-submit" type="submit">ساخت حساب <span>←</span></button>
      </form>
      <button class="account-switch" id="account-switch" type="button">حساب ندارم؛ ثبت‌نام می‌کنم</button>
    </section>
  </main>
  <script src="{% static 'storefront/js/account.js' %}" defer></script>
</body>
</html>
