{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="customerDashboard">داشبورد مشتری | Nexora</title>
  <link rel="stylesheet" href="{% static 'storefront/css/app.css' %}">
</head>
<body>
  <header class="site-header"><div class="container nav-wrap">
    <a class="brand" href="/"><span class="brand-mark">N</span><span>NEXORA<small>SMART ESSENTIALS</small></span></a>
    <div class="page-actions"><button class="icon-button" id="theme-toggle" type="button" aria-label="تغییر تم">☾</button><button class="language-button" data-language-toggle type="button">English</button><a class="text-link" data-i18n="storeBack" href="/">بازگشت به فروشگاه <span>←</span></a></div>
  </div></header>
  <main class="dashboard-page container">
    <div id="dashboard-alert" class="state-card" hidden></div>
    <section id="dashboard-content" hidden>
      <div class="section-heading dashboard-heading"><div><p class="eyebrow"><span></span> <span data-i18n="yourAccount">حساب شما</span></p><h1 class="dashboard-title" data-i18n="customerDashboard">داشبورد مشتری</h1><p id="dashboard-profile" class="account-subtitle"></p><span id="dashboard-role" class="role-badge"></span></div><div class="dashboard-actions"><a class="secondary-button" href="/profile/?section=personal" data-i18n="personalInfo">اطلاعات شخصی</a><a class="primary-button" href="/" data-i18n="buyProduct">خرید محصول <span>←</span></a></div></div>
      <div class="dashboard-shortcuts"><a href="/profile/?section=personal"><strong data-i18n="personalInfo">اطلاعات شخصی</strong><small data-i18n="personalInfoHint">نام، ایمیل و شماره تماس</small></a><a href="/profile/?section=addresses"><strong data-i18n="addresses">آدرس‌ها</strong><small data-i18n="addressManagement">مدیریت آدرس‌های ارسال</small></a><a href="/profile/?section=orders"><strong data-i18n="purchases">خریدها</strong><small data-i18n="purchaseHistory">تاریخچه و جزئیات سفارش‌ها</small></a><a href="/profile/?section=security"><strong data-i18n="accountSecurity">امنیت حساب</strong><small data-i18n="changePassword">تغییر رمز عبور</small></a></div>
      <section class="dashboard-panel"><div class="panel-heading"><h2 data-i18n="myOrders">سفارش‌های من</h2><span id="order-count"></span></div><div id="orders-list"></div></section>
    </section>
  </main>
  <script src="{% static 'storefront/js/i18n.js' %}" defer></script><script src="{% static 'storefront/js/dashboard.js' %}" defer></script>
</body>
</html>
