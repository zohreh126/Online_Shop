<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" fill="none">
  <defs>
    <linearGradient id="violetRibbon" x1="60" y1="160" x2="1490" y2="1050" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7150B4" stop-opacity=".08"/>
      <stop offset=".34" stop-color="#9B7BD2" stop-opacity=".72"/>
      <stop offset=".68" stop-color="#EF9C83" stop-opacity=".62"/>
      <stop offset="1" stop-color="#7150B4" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="violetGlass" x1="110" y1="30" x2="530" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset=".28" stop-color="#DCCCF5" stop-opacity=".6"/>
      <stop offset=".72" stop-color="#9B7BD2" stop-opacity=".44"/>
      <stop offset="1" stop-color="#7150B4" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="coralGlass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".7"/>
      <stop offset=".38" stop-color="#F6C4B5" stop-opacity=".64"/>
      <stop offset="1" stop-color="#EF9C83" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="deepPanel" x1="240" y1="1240" x2="820" y2="1860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#493660" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#7150B4" stop-opacity=".38"/>
      <stop offset="1" stop-color="#EF9C83" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="violetOrb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 260) rotate(46) scale(530 470)">
      <stop stop-color="#B69BE7" stop-opacity=".9"/>
      <stop offset=".46" stop-color="#9B7BD2" stop-opacity=".62"/>
      <stop offset=".82" stop-color="#7150B4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7150B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralOrb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1430 820) rotate(136) scale(480 410)">
      <stop stop-color="#F6B9A6" stop-opacity=".78"/>
      <stop offset=".48" stop-color="#EF9C83" stop-opacity=".45"/>
      <stop offset="1" stop-color="#EF9C83" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomOrb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 1960) rotate(45) scale(510 420)">
      <stop stop-color="#9B7BD2" stop-opacity=".58"/>
      <stop offset=".62" stop-color="#7150B4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7150B4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#7150B4" stroke-opacity=".11" stroke-width="1"/>
      <circle cx="1" cy="1" r="1.5" fill="#EF9C83" fill-opacity=".13"/>
    </pattern>
    <filter id="blurLarge" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="blurMedium" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Soft light fields keep the page colorful even between content blocks. -->
  <g filter="url(#blurLarge)">
    <ellipse cx="150" cy="240" rx="470" ry="380" fill="url(#violetOrb)"/>
    <ellipse cx="1430" cy="820" rx="430" ry="360" fill="url(#coralOrb)"/>
    <ellipse cx="260" cy="1960" rx="470" ry="380" fill="url(#bottomOrb)"/>
  </g>

  <rect width="1600" height="2200" fill="url(#grid)" opacity=".38"/>

  <!-- Large editorial ribbon / wave. -->
  <path d="M-260 720C40 300 330 340 570 650C790 936 1060 1110 1880 650" stroke="url(#violetRibbon)" stroke-width="180" stroke-linecap="round" opacity=".24" filter="url(#blurMedium)"/>
  <path d="M-260 720C40 300 330 340 570 650C790 936 1060 1110 1880 650" stroke="url(#violetRibbon)" stroke-width="54" stroke-linecap="round" opacity=".38"/>
  <path d="M-220 804C72 426 330 466 548 738C770 1014 1080 1190 1850 760" stroke="#EF9C83" stroke-width="3" stroke-opacity=".32"/>
  <path d="M-200 850C92 480 350 530 560 792C786 1070 1086 1230 1830 820" stroke="#7150B4" stroke-width="2" stroke-opacity=".22" stroke-dasharray="16 18"/>

  <!-- Translucent glass panels make the background read as a designed scene. -->
  <g filter="url(#blurSmall)" opacity=".62">
    <rect x="-100" y="70" width="500" height="660" rx="132" transform="rotate(-15 -100 70)" fill="url(#violetGlass)" stroke="#7150B4" stroke-opacity=".5" stroke-width="3"/>
    <rect x="1120" y="390" width="430" height="600" rx="120" transform="rotate(18 1120 390)" fill="url(#coralGlass)" stroke="#EF9C83" stroke-opacity=".58" stroke-width="3"/>
    <rect x="230" y="1300" width="540" height="560" rx="120" transform="rotate(12 230 1300)" fill="url(#deepPanel)" stroke="#9B7BD2" stroke-opacity=".46" stroke-width="3"/>
    <rect x="1110" y="1600" width="370" height="430" rx="102" transform="rotate(-16 1110 1600)" fill="url(#coralGlass)" stroke="#EF9C83" stroke-opacity=".34" stroke-width="3"/>
  </g>
  <g opacity=".48">
    <rect x="-40" y="100" width="390" height="560" rx="110" transform="rotate(-15 -40 100)" stroke="#C5B1ED" stroke-width="2"/>
    <rect x="1172" y="430" width="340" height="490" rx="100" transform="rotate(18 1172 430)" stroke="#F2B4A1" stroke-width="2"/>
    <rect x="285" y="1350" width="460" height="470" rx="108" transform="rotate(12 285 1350)" stroke="#A88BDA" stroke-width="2"/>
  </g>

  <!-- Orbit systems and nodes. -->
  <g opacity=".58" stroke="#7150B4" stroke-width="2">
    <ellipse cx="230" cy="350" rx="360" ry="150" transform="rotate(-26 230 350)"/>
    <ellipse cx="230" cy="350" rx="450" ry="235" transform="rotate(-26 230 350)"/>
    <ellipse cx="1360" cy="780" rx="330" ry="140" transform="rotate(30 1360 780)"/>
    <ellipse cx="1360" cy="780" rx="440" ry="225" transform="rotate(30 1360 780)"/>
    <ellipse cx="510" cy="1640" rx="340" ry="150" transform="rotate(22 510 1640)"/>
  </g>
  <g opacity=".56" stroke="#EF9C83" stroke-width="2">
    <circle cx="225" cy="306" r="12" fill="#EF9C83" fill-opacity=".82"/>
    <circle cx="225" cy="306" r="34"/>
    <path d="M225 262V350M181 306H269"/>
    <circle cx="1392" cy="804" r="11" fill="#EF9C83" fill-opacity=".82"/>
    <circle cx="1392" cy="804" r="31"/>
    <path d="M1392 764V844M1352 804H1432"/>
    <circle cx="470" cy="1655" r="9" fill="#9B7BD2" fill-opacity=".8"/>
  </g>

  <!-- Floating glass discs and a few bright accents. -->
  <g filter="url(#blurMedium)" opacity=".45">
    <circle cx="690" cy="1080" r="100" fill="#9B7BD2"/>
    <circle cx="930" cy="1260" r="78" fill="#EF9C83"/>
    <circle cx="1190" cy="1490" r="58" fill="#7150B4"/>
  </g>
  <g opacity=".42" stroke="#FFFFFF" stroke-width="2">
    <circle cx="690" cy="1080" r="132"/>
    <circle cx="930" cy="1260" r="104"/>
    <circle cx="1190" cy="1490" r="82"/>
  </g>
  <g fill="#EF9C83" opacity=".56">
    <circle cx="1020" cy="240" r="5"/>
    <circle cx="1080" cy="290" r="3"/>
    <circle cx="760" cy="520" r="4"/>
    <circle cx="840" cy="580" r="7"/>
    <circle cx="820" cy="1820" r="5"/>
  </g>

  <!-- Commerce constellation: quiet line-art motifs for a digital storefront. -->
  <g id="commerce-motifs" opacity=".26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shopping bag -->
    <g transform="translate(120 820) rotate(-8 150 150)">
      <path d="M66 76h178l-15 220H81L66 76Z" fill="url(#violetGlass)" fill-opacity=".3" stroke="#7150B4" stroke-opacity=".58" stroke-width="3"/>
      <path d="M105 82c0-54 31-82 80-82s80 28 80 82" stroke="#EF9C83" stroke-opacity=".72" stroke-width="8"/>
      <path d="M108 160h94M108 195h62" stroke="#7150B4" stroke-opacity=".48" stroke-width="4"/>
      <circle cx="227" cy="196" r="17" fill="#EF9C83" fill-opacity=".28" stroke="#EF9C83" stroke-width="3"/>
      <path d="M219 196h16M227 188v16" stroke="#EF9C83" stroke-width="3"/>
    </g>

    <!-- Price tag -->
    <g transform="translate(850 170) rotate(12 100 80)">
      <path d="M16 54 112 12l92 72-104 92-84-67Z" fill="url(#coralGlass)" fill-opacity=".3" stroke="#EF9C83" stroke-opacity=".68" stroke-width="3"/>
      <circle cx="66" cy="72" r="13" stroke="#7150B4" stroke-width="4"/>
      <path d="m112 78 42 42M126 64l30 30" stroke="#7150B4" stroke-opacity=".42" stroke-width="4"/>
    </g>

    <!-- Product card / digital catalogue tile -->
    <g transform="translate(1030 1040) rotate(-7 180 120)">
      <rect width="360" height="220" rx="28" fill="url(#coralGlass)" fill-opacity=".24" stroke="#EF9C83" stroke-opacity=".58" stroke-width="3"/>
      <rect x="26" y="28" width="106" height="164" rx="19" fill="url(#violetGlass)" fill-opacity=".32" stroke="#7150B4" stroke-opacity=".44" stroke-width="2"/>
      <circle cx="79" cy="92" r="32" stroke="#7150B4" stroke-width="3"/>
      <path d="M61 92h36M79 74v36" stroke="#EF9C83" stroke-width="4"/>
      <path d="M166 72h132M166 105h96M166 153h70" stroke="#7150B4" stroke-opacity=".48" stroke-width="5"/>
      <circle cx="301" cy="158" r="18" fill="#EF9C83" fill-opacity=".34" stroke="#EF9C83" stroke-width="3"/>
    </g>

    <!-- Parcel / delivery box -->
    <g transform="translate(390 1730) rotate(8 150 120)">
      <path d="m28 82 128-58 144 62-132 65L28 82Z" fill="url(#violetGlass)" fill-opacity=".28" stroke="#7150B4" stroke-opacity=".55" stroke-width="3"/>
      <path d="M28 82v132l140 70 132-72V86M168 149v135M98 52l140 66" stroke="#7150B4" stroke-opacity=".5" stroke-width="3"/>
      <path d="m196 91 27-12 27 12-27 14-27-14Z" fill="#EF9C83" fill-opacity=".42" stroke="#EF9C83" stroke-width="3"/>
    </g>

    <!-- Shopping cart and delivery trail -->
    <g transform="translate(1120 1735) rotate(-9 170 120)">
      <path d="M18 28h34l29 137h180l35-102H82" stroke="#7150B4" stroke-opacity=".58" stroke-width="7"/>
      <path d="M107 190h122" stroke="#EF9C83" stroke-opacity=".62" stroke-width="7"/>
      <circle cx="113" cy="223" r="19" fill="#EF9C83" fill-opacity=".28" stroke="#EF9C83" stroke-width="4"/>
      <circle cx="235" cy="223" r="19" fill="#EF9C83" fill-opacity=".28" stroke="#EF9C83" stroke-width="4"/>
      <path d="M118 80h125M132 112h91" stroke="#7150B4" stroke-opacity=".36" stroke-width="4"/>
    </g>
    <path d="M690 1930c160-126 294-155 436-114 103 30 180 12 246-48" stroke="#EF9C83" stroke-opacity=".38" stroke-width="3" stroke-dasharray="10 18"/>
    <path d="m1352 1744 25 24-31 14" stroke="#EF9C83" stroke-opacity=".5" stroke-width="4"/>

    <!-- Computer accessory silhouettes -->
    <g id="computer-accessories" opacity=".62">
      <!-- Mechanical keyboard -->
      <g transform="translate(205 410) rotate(-7 190 80)">
        <rect width="380" height="154" rx="26" fill="url(#violetGlass)" fill-opacity=".26" stroke="#7150B4" stroke-opacity=".52" stroke-width="3"/>
        <path d="M25 38h330M25 78h330M25 118h330" stroke="#7150B4" stroke-opacity=".24" stroke-width="2"/>
        <path d="M45 26v20M75 26v20M105 26v20M135 26v20M165 26v20M195 26v20M225 26v20M255 26v20M285 26v20M315 26v20M345 26v20M45 66v20M75 66v20M105 66v20M135 66v20M165 66v20M195 66v20M225 66v20M255 66v20M285 66v20M315 66v20M345 66v20M45 106v20M75 106v20M105 106v20M135 106v20M165 106v20M195 106v20M225 106v20M255 106v20M285 106v20M315 106v20" stroke="#EF9C83" stroke-opacity=".34" stroke-width="3"/>
        <rect x="274" y="91" width="72" height="28" rx="8" fill="#EF9C83" fill-opacity=".2" stroke="#EF9C83" stroke-opacity=".5" stroke-width="2"/>
      </g>

      <!-- Wireless mouse -->
      <g transform="translate(1250 1160) rotate(18 70 96)">
        <path d="M70 8c42 0 70 35 70 82v42c0 47-28 82-70 82S0 179 0 132V90C0 43 28 8 70 8Z" fill="url(#coralGlass)" fill-opacity=".27" stroke="#EF9C83" stroke-opacity=".6" stroke-width="3"/>
        <path d="M70 12v88M45 73h50" stroke="#7150B4" stroke-opacity=".46" stroke-width="3"/>
        <rect x="61" y="40" width="18" height="28" rx="9" fill="#7150B4" fill-opacity=".24" stroke="#7150B4" stroke-opacity=".5" stroke-width="2"/>
      </g>

      <!-- Headset -->
      <g transform="translate(525 860) rotate(-9 140 120)">
        <path d="M24 132c0-91 52-144 116-144s116 53 116 144" stroke="#7150B4" stroke-opacity=".56" stroke-width="17"/>
        <rect x="5" y="112" width="46" height="92" rx="18" fill="url(#violetGlass)" fill-opacity=".3" stroke="#EF9C83" stroke-opacity=".55" stroke-width="3"/>
        <rect x="229" y="112" width="46" height="92" rx="18" fill="url(#violetGlass)" fill-opacity=".3" stroke="#EF9C83" stroke-opacity=".55" stroke-width="3"/>
        <path d="M50 184c-6 46 28 69 70 69h55" stroke="#EF9C83" stroke-opacity=".46" stroke-width="5"/>
        <circle cx="188" cy="253" r="8" fill="#EF9C83" fill-opacity=".55"/>
      </g>

      <!-- Monitor and desk display -->
      <g transform="translate(660 1390) rotate(5 160 130)">
        <rect width="320" height="192" rx="20" fill="url(#violetGlass)" fill-opacity=".24" stroke="#7150B4" stroke-opacity=".52" stroke-width="3"/>
        <path d="M32 38h256M32 145h256" stroke="#EF9C83" stroke-opacity=".3" stroke-width="3"/>
        <circle cx="70" cy="88" r="28" stroke="#EF9C83" stroke-opacity=".45" stroke-width="3"/>
        <path d="M58 88h24M70 76v24M126 78h124M126 104h88" stroke="#7150B4" stroke-opacity=".42" stroke-width="4"/>
        <path d="M126 192v46M72 238h108" stroke="#7150B4" stroke-opacity=".52" stroke-width="5"/>
      </g>

      <!-- USB / charging cable -->
      <path d="M945 1530c-76-60-143-28-118 46 22 65 137 36 156 105 14 53-42 84-96 48" stroke="#EF9C83" stroke-opacity=".48" stroke-width="5" stroke-dasharray="14 12"/>
      <rect x="826" y="1518" width="34" height="23" rx="5" fill="url(#coralGlass)" fill-opacity=".3" stroke="#EF9C83" stroke-opacity=".58" stroke-width="3"/>
      <path d="M858 1524h18v11h-18" stroke="#7150B4" stroke-opacity=".45" stroke-width="3"/>
    </g>
  </g>
</svg>
